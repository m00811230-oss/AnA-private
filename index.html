<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnA Private - Pookie Chat 🎀</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- PubNub SDK -->
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        nunito: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        pookie: {
                            pink: '#FFB7B2',
                            lightpink: '#FFDAC1',
                            softpurple: '#E2F0CB',
                            bg: '#FFF5F5',
                            card: '#FFFFFF',
                            pumpchikin: '#FF9AA2',
                            peanut: '#B5EAD7',
                            accent: '#FF6B81'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FFF0F5;
            background-image: radial-gradient(#FFB7B2 0.75px, transparent 0.75px), radial-gradient(#FFB7B2 0.75px, #FFF0F5 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #FFB7B2;
            border-radius: 20px;
        }
        .floating-heart {
            position: absolute;
            animation: floatUp 4s infinite linear;
            opacity: 0.6;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0.7; }
            50% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden">

    <!-- Floating Background Hearts -->
    <div id="heartContainer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    <!-- Main Container -->
    <div class="w-full max-w-md h-[95vh] bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border-4 border-pink-200 flex flex-col overflow-hidden relative">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-pink-300 via-pink-200 to-purple-200 p-4 border-b-2 border-pink-200 flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-xl shadow-inner border border-pink-300" id="headerAvatar">
                    💖
                </div>
                <div>
                    <h1 class="font-fredoka text-xl text-pink-700 font-bold tracking-wide flex items-center gap-1">
                        AnA Private <span class="text-xs bg-white/80 text-pink-600 px-2 py-0.5 rounded-full border border-pink-200">pookie</span>
                    </h1>
                    <p class="text-xs text-pink-600 font-medium" id="statusText">Not Connected</p>
                </div>
            </div>
            <button onclick="toggleSettings()" class="text-pink-500 hover:text-pink-700 transition-transform active:scale-95 p-2">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>

        <!-- Connection Modal / Settings -->
        <div id="connectionPanel" class="absolute inset-0 bg-white/95 backdrop-blur-md z-30 flex flex-col justify-center p-6 transition-all duration-300">
            <div class="text-center mb-6">
                <div class="text-5xl mb-2 animate-bounce">🎀</div>
                <h2 class="font-fredoka text-2xl text-pink-600 font-bold">Welcome Pookie!</h2>
                <p class="text-xs text-gray-500 mt-1">Connect to your secret love room 💕</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-pink-600 mb-1 uppercase tracking-wider">Who are you?</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" onclick="selectPersona('pumpchikin')" id="btnPumpchikin" class="p-3 border-2 border-pink-200 rounded-2xl flex items-center justify-center gap-2 font-bold text-gray-700 hover:border-pink-400 transition-all">
                            <span>pumpchikin</span> 🎃
                        </button>
                        <button type="button" onclick="selectPersona('peanut')" id="btnPeanut" class="p-3 border-2 border-pink-200 rounded-2xl flex items-center justify-center gap-2 font-bold text-gray-700 hover:border-pink-400 transition-all">
                            <span>peanut</span> 🥜
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-pink-600 mb-1 uppercase tracking-wider">Secret Room Code</label>
                    <input type="password" id="roomCodeInput" value="ana2026" placeholder="Enter secret code..." class="w-full px-4 py-3 border-2 border-pink-200 rounded-2xl text-center font-bold text-pink-600 focus:outline-none focus:border-pink-400 bg-pink-50/50">
                </div>

                <button onclick="connectRoom()" class="w-full bg-gradient-to-r from-pink-400 to-rose-400 text-white font-fredoka font-bold py-3.5 rounded-2xl shadow-lg hover:opacity-95 transition-all transform active:scale-95 text-lg">
                    Connect Room 💕
                </button>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chatMessages" class="flex-1 p-4 overflow-y-auto chat-scroll space-y-3 bg-gradient-to-b from-pink-50/30 to-white/50">
            <div class="text-center my-4">
                <span class="bg-pink-100/80 text-pink-500 text-xs px-3 py-1 rounded-full border border-pink-200 font-medium">
                    🔒 Messages are end-to-end secret
                </span>
            </div>
        </div>

        <!-- Attachment Preview Bar -->
        <div id="previewContainer" class="hidden p-2 bg-pink-50 border-t border-pink-200 flex items-center justify-between">
            <div id="previewContent" class="flex items-center gap-2 overflow-hidden text-xs text-pink-700 font-medium"></div>
            <button onclick="clearPreview()" class="text-pink-400 hover:text-pink-600 p-1">
                <i class="fa-solid fa-circle-xmark"></i>
            </button>
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-white border-t-2 border-pink-100 flex items-center gap-2">
            <!-- Media Upload Button -->
            <div class="relative">
                <button onclick="toggleMediaMenu()" class="w-10 h-10 rounded-full bg-pink-100 hover:bg-pink-200 text-pink-500 flex items-center justify-center transition-all">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <!-- Media Popover -->
                <div id="mediaMenu" class="hidden absolute bottom-12 left-0 bg-white border-2 border-pink-200 rounded-2xl shadow-xl p-2 flex gap-2 z-20">
                    <label class="w-10 h-10 rounded-xl bg-pink-50 hover:bg-pink-100 text-pink-500 flex items-center justify-center cursor-pointer transition-all" title="Photo">
                        <i class="fa-solid fa-image"></i>
                        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleFileSelect(event, 'image')">
                    </label>
                    <label class="w-10 h-10 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-500 flex items-center justify-center cursor-pointer transition-all" title="Document">
                        <i class="fa-solid fa-file-lines"></i>
                        <input type="file" id="docInput" accept=".pdf,.doc,.docx,.txt" class="hidden" onchange="handleFileSelect(event, 'doc')">
                    </label>
                </div>
            </div>

            <!-- Text Input -->
            <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 bg-pink-50/60 border-2 border-pink-200 rounded-2xl px-4 py-2 text-sm text-gray-700 focus:outline-none focus:border-pink-400" onkeypress="handleKeyPress(event)">

            <!-- Voice Record Button -->
            <button id="voiceBtn" onclick="toggleVoiceRecording()" class="w-10 h-10 rounded-full bg-rose-100 hover:bg-rose-200 text-rose-500 flex items-center justify-center transition-all">
                <i class="fa-solid fa-microphone"></i>
            </button>

            <!-- Send Button -->
            <button onclick="sendMessage()" class="w-10 h-10 rounded-full bg-gradient-to-r from-pink-400 to-rose-400 text-white flex items-center justify-center shadow-md hover:opacity-90 transition-all transform active:scale-95">
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </div>
    </div>

    <!-- Full Image Modal -->
    <div id="imageModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" onclick="closeImageModal()">
        <img id="modalImg" class="max-w-full max-h-full rounded-2xl shadow-2xl">
    </div>

    <script>
        let pubnub = null;
        let selectedPersona = null;
        let roomCode = 'ana2026';
        let pendingAttachment = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // Initialize PubNub Keys
        const pubkey = 'sub-c-5f8f30be-6ee1-11e9-a359-2a2d480c54a8'; // Demo Key
        const subkey = 'sub-c-5f8f30be-6ee1-11e9-a359-2a2d480c54a8'; 

        function selectPersona(persona) {
            selectedPersona = persona;
            const btnPump = document.getElementById('btnPumpchikin');
            const btnPea = document.getElementById('btnPeanut');

            if (persona === 'pumpchikin') {
                btnPump.classList.add('bg-pink-100', 'border-pink-400', 'text-pink-600');
                btnPea.classList.remove('bg-pink-100', 'border-pink-400', 'text-pink-600');
            } else {
                btnPea.classList.add('bg-pink-100', 'border-pink-400', 'text-pink-600');
                btnPump.classList.remove('bg-pink-100', 'border-pink-400', 'text-pink-600');
            }
        }

        function connectRoom() {
            const inputCode = document.getElementById('roomCodeInput').value.trim();
            if (!selectedPersona) {
                alert('Please select who you are 💕');
                return;
            }
            if (!inputCode) {
                alert('Please enter secret code!');
                return;
            }

            roomCode = inputCode;
            document.getElementById('connectionPanel').classList.add('hidden');
            document.getElementById('statusText').innerText = `Connected as ${selectedPersona === 'pumpchikin' ? 'pumpchikin 🎃' : 'peanut 🥜'}`;

            // Initialize PubNub
            pubnub = new PubNub({
                publishKey: 'demo',
                subscribeKey: 'demo',
                userId: selectedPersona + '_' + Math.random().toString(36).substring(2, 7)
            });

            pubnub.subscribe({ channels: ['ana_room_' + roomCode] });

            pubnub.addListener({
                message: function(event) {
                    renderMessage(event.message);
                }
            });

            spawnHearts();
        }

        function toggleSettings() {
            document.getElementById('connectionPanel').classList.toggle('hidden');
        }

        function toggleMediaMenu() {
            document.getElementById('mediaMenu').classList.toggle('hidden');
        }

        function handleFileSelect(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                pendingAttachment = {
                    type: type,
                    data: e.target.result,
                    name: file.name
                };
                showPreview(type, file.name);
            };
            reader.readAsDataURL(file);
            document.getElementById('mediaMenu').classList.add('hidden');
        }

        function showPreview(type, name) {
            const container = document.getElementById('previewContainer');
            const content = document.getElementById('previewContent');
            container.classList.remove('hidden');
            content.innerHTML = `<i class="fa-solid ${type === 'image' ? 'fa-image' : 'fa-file'} text-pink-500"></i> <span class="truncate max-w-[200px]">${name}</span>`;
        }

        function clearPreview() {
            pendingAttachment = null;
            document.getElementById('previewContainer').classList.add('hidden');
        }

        async function toggleVoiceRecording() {
            const voiceBtn = document.getElementById('voiceBtn');
            
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            pendingAttachment = {
                                type: 'voice',
                                data: reader.result,
                                name: 'Voice Note 🎙️'
                            };
                            sendMessage();
                        };
                        reader.readAsDataURL(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    voiceBtn.classList.add('bg-red-500', 'text-white', 'animate-pulse');
                } catch (err) {
                    alert('Microphone access denied or not supported.');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                voiceBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text && !pendingAttachment) return;

            const msgData = {
                sender: selectedPersona,
                text: text,
                attachment: pendingAttachment,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            pubnub.publish({
                channel: 'ana_room_' + roomCode,
                message: msgData
            });

            input.value = '';
            clearPreview();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function renderMessage(msg) {
            const chatContainer = document.getElementById('chatMessages');
            const isMe = msg.sender === selectedPersona;

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} my-1`;

            let senderTag = msg.sender === 'pumpchikin' ? 'pumpchikin 🎃' : 'peanut 🥜';
            let bgBubble = isMe 
                ? 'bg-gradient-to-r from-pink-300 to-rose-300 text-gray-800 rounded-2xl rounded-tr-none shadow-sm'
                : 'bg-white border-2 border-pink-100 text-gray-800 rounded-2xl rounded-tl-none shadow-sm';

            let mediaHTML = '';
            if (msg.attachment) {
                if (msg.attachment.type === 'image') {
                    mediaHTML = `<img src="${msg.attachment.data}" class="max-w-[200px] rounded-xl my-1 border border-pink-200 cursor-pointer" onclick="openImageModal('${msg.attachment.data}')">`;
                } else if (msg.attachment.type === 'doc') {
                    mediaHTML = `<a href="${msg.attachment.data}" download="${msg.attachment.name}" class="flex items-center gap-2 p-2 bg-pink-50 rounded-xl my-1 text-xs text-pink-600 font-bold border border-pink-200"><i class="fa-solid fa-file-arrow-down text-lg"></i> ${msg.attachment.name}</a>`;
                } else if (msg.attachment.type === 'voice') {
                    mediaHTML = `<audio controls src="${msg.attachment.data}" class="my-1 max-w-[220px] h-8"></audio>`;
                }
            }

            msgDiv.innerHTML = `
                <span class="text-[10px] text-pink-400 font-bold mb-0.5 px-1">${senderTag}</span>
                <div class="${bgBubble} p-3 max-w-[80%] break-words text-sm">
                    ${mediaHTML}
                    ${msg.text ? `<p>\${msg.text}</p>` : ''}
                </div>
                <span class="text-[9px] text-gray-400 mt-0.5 px-1">${msg.time}</span>
            `;

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function openImageModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        function spawnHearts() {
            const container = document.getElementById('heartContainer');
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart text-pink-300 text-sm';
                heart.innerText = ['💖', '🌸', '✨', '💕'][Math.floor(Math.random() * 4)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }, 1000);
        }
    </script>
</body>
</html>
